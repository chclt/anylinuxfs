[package]
name = "usbproxy"
version = "0.20.1"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.35", features = ["derive"] }
common_utils = { path = "../common-utils" }
libc = "0.2.177"
libusb1-sys = { version = "0.7", features = ["vendored"] }
rusb = { version = "0.9.4", features = ["vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
signal-hook = "0.3.17"
